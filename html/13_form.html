<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- form tag field
    input inline self
    -->

    <!-- html normal -->
    <fieldset>
        <legend>Login-form</legend>
        <table align="center">

            <form action="">

                <tr>
                    <td><label for="">Enter your Name</label></td>
                    <td><input type="text" placeholder="enter your name" value="" title="Name"></td>
                </tr>
                <tr>
                    <td> <label for="">Enter your Surname</label></td>
                    <td> <input type="text" placeholder="Enter your Surname"></td>
                </tr>
                <tr>
                    <td><label for="">Enter your Email</label></td>
                    <td><input type="email" placeholder="Enter your Email"></td>
                </tr>
                <tr>
                    <td><label for="">Enter your phone</label></td>
                    <td><input type="tel" placeholder="Enter your phone"></td>
                </tr>
                <tr>
                    <td><label for="">Enter your password</label></td>
                    <td><input type="password" placeholder="Enter your password"></td>
                </tr>
                <tr>
                    <td align="center" colspan="2"><input type="submit" value="login"></td>
                </tr>

            </form>
        </table>
    </fieldset>


</body>

</html>
