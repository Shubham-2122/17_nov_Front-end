</head>
<body>
    <h1 id="h1">hello this style data</h1>
    <button onclick="demo()">Show Style</button>


    <script>

        let h1_tag = document.getElementById("h1")

        function demo(){
            // js style 
            h1_tag.style.background = "red";
            h1_tag.style.color = "white";
            h1_tag.style.fontSize = "50px"
            h1_tag.style.padding = "30px"
        }

    </script>
</body>
