<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let x =30,y=20

        let choice = "+"

        switch (choice) {
            case "+":
                console.log("Sum : ",x+y)
                break;
            case "-":
                console.log("Sub : ",x-y)
                break;
            case "*":
                console.log("Mul : ",x*y)
                break;
        
            default:
                console.log("Invalid Symbol")
                break;
        }

    </script>
</body>
</html>
