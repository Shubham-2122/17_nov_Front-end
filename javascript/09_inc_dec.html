<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- inc ++/ dec-- -->

    <!-- pre inc ++value
        post inc value++
    -->

    <script>
        let a = 10
        console.log("A : ", a)
        a++;
        console.log("A : ", a)//11

        ++a;
        console.log("A : ", a)//12
        console.log("A : ", ++a) //13
        console.log("A : ", a++) //13 //14

        console.log("A : ", a++) //14
        console.log("A : ", ++a) //16
        console.log("A : ", a++) //16
        console.log("A : ", a++) //17 
        console.log("A : ", ++a) //19
        console.log("A : ", ++a) //20
        console.log("A : ", a++) //20
        console.log("A : ", ++a) //22
        console.log("A : ", a++) //22
        console.log("A : ", ++a) //24
        console.log("A : ", a++) //24
        console.log("A : ", ++a) //26


        console.log("A : ", a)


        console.log("A : ", a--) //post dec
        console.log("A : ", --a) //pre dec

    </script>


</body>

</html>
