<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- datatype : primitive and non primitvie  -->

    <!-- primitvie  -->
    <!-- 1) number 
    2) string 
    3) booloen
    4) null
    5) undefined
    6) symbols 
    7) bigINT -->

    <script>
        // 1) number 
        let num = 2.65 
        console.log("num :",num)
        console.log(typeof(num))

        // 2) string 
        let name = "het patel"
        console.log(name)
        console.log(typeof(name))

        // 3) boolen
        let data = false 
        console.log(data)
        console.log(typeof(data))

        // 4) undefined 

        let val 
        console.log(val)
        console.log(typeof(val))

        // 5) null 
        let data1 = null 
        console.log(data1)
        console.log(typeof(null))

        // 6) bigint 
        let num1 = BigInt(6876785665467)
        console.log(num1)
        console.log(typeof(num1))

        // 7) symbole 

        let mange = Symbol("saj")
        console.log(mange)
        console.log(typeof(mange))

    </script>
</body>
</html>
