<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- (codtion) ? true : false  -->


    <script>
        let x = 30, y = 20;

        // console.log((x>y)?true:false)
        console.log((x < y) ? true : false)

        console.log((x > y) ? x : y)

        console.log((x < y) ? x : y)

        let a = 10, b = "10";

        // value compare
        console.log((a == b) ? true : false)

        // value and datatype
        console.log((a === b) ? true : false)

          console.log((a != b) ? true : false)
    </script>
</body>

</html>
