<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1) arr inside arr 
    2) object inside object 
    3) arr inside object 
    4) object inside arr  -->

    <script>

        // 1) arr inside arr 
        let arr = [1,2,3,[4,5,6,[7,8,9]]]
        console.log(arr)
        console.log(arr[1])
        console.log(arr[3][1])
        console.log(arr[3][3][1])

        // 2) object inside onbj
        let person  = {
            name : "het",
            course : {
                front :"Front-end",
                back : "back-end"
            }
        }

        console.log(person)
        console.log(person.course.back)

        // 3) arrr inside obj 
        let arr1 = [1,2,3,5,{
            name : "Parth",
            age : 23
        }]

        console.log(arr1[4].name)

        // 4) object inside arr  

        let person1 = {
            name : "karn",
            course : ["front","Back","full-stack"]
        }
        console.log(person1)
        console.log(person1.course[2])

    </script>

</body>
</html>
