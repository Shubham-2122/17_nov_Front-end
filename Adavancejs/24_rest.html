<body>
    <!-- ...rest , ...spared -->

    <script>

        function demo(...score) {
            let sum = 0
            for (let data in score) {
                sum = sum + score[data]
            }
            return sum
        }


        console.log(demo(30,40,60,70))


    </script>
</body>
