<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-auto-rows: 200px;
          
        }
        .box{
            border: 2px solid;
        }
        #box1{
            grid-column: 2/4;
        }
        #box2{
            grid-row: 1/3;
        }
    </style>
</head>
<body>
    <!-- flex row -->
    <!-- grid row and col -->
    <div class="main">
        <div class="box" id="box2">1</div>
        <div class="box" id="box1">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
    </div>
</body>
</html>
