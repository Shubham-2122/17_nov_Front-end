<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 200px;
            width: 200px;
            border: 2px solid;
        }
    </style>
</head>

<body>
    <h1 style="border: 2px solid red;">Hello border</h1>

    <h1 style="border-width: 5px; border-style: solid;border-color: aqua;">Hello border</h1>
    <h1 style="border: 2px dashed red;">Hello border</h1>
    <h1 style="border: 2px dotted red;">Hello border</h1>
    <h1 style="border: 2px double red;">Hello border</h1>
    <h1 style="border: 5px inset red;">Hello border</h1>
    <h1 style="border: 5px ridge red;">Hello border</h1>
    <h1 style="border-top: 5px solid;">Border top</h1>
    <h1 style="border-right: 10px solid red;">Border top</h1>
    <h1 style="border-left: 10px solid red;">Border top</h1>
    <h1 style="border-bottom: 10px solid red;">Border top</h1>

    <div class="main">

    </div>
</body>

</html>
