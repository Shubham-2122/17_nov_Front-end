<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- css ruleset
        h1{
            property-name : value;
        } 
    -->

    <h1 style="background-color: red;">Hello normal color</h1>

    <h1 style="background-color: green;">Hello normal color</h1>

    <h1 style="background-color: #cac83c;">Hello this hex color #000</h1>

    <!-- rage 0-255 -->
    <h1 style="background-color: rgb(210, 85, 210);">Hello this rgb red,green,blue</h1>

    <!-- alph.opacity : 0- 1 -->
         <h1 style="background-color: rgba(5, 9, 238,1);">Hello this rgb red,green,blue</h1>
    <h1 style="background-color: rgba(5, 9, 238, 0.612);">Hello this rgb red,green,blue</h1>

    <h1 style="background-color: hsl(297, 75%, 47%);">hello this hsl</h1>
     <h1 style="background-color: hsla(297, 75%, 47%,0.4);">hello this hsl</h1>
</body>

</html>
